[package]
name = "sentinel-vault"
description = "NEAR Sentinel spending vault: per-agent allowance with per-payment and daily limits, receiver allowlist and pay-once intents, usable with a function-call key."
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
license = "MIT"
repository = "https://github.com/kariosg/near-sentinel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
