[package]
name = "sentinel-guard"
description = "NEAR Sentinel idempotency guard: forwards a payment at most once per (payer, intent_id)."
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
license = "MIT"
repository = "https://github.com/kariosg/near-sentinel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
